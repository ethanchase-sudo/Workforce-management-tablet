                <td><Icon n="chevR" size="sm" className="faint"/></td>
              </tr>))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Analytics({ inspections, assigned }) {
  const [period, setPeriod] = React.useState('week');
  const [dept, setDept] = React.useState('All');
  const [view, setView] = React.useState('attendance');
  const A = WH_ANALYTICS[period];
  const dm = dept==='All'?1:({Warehouse:.37,Maintenance:.24,Quality:.17,Logistics:.14,Safety:.08})[dept];
  const extra = period==='week' ? inspections.filter(i=>i.fresh) : [];
  const passed = Math.round(A.passed*dm) + extra.filter(i=>i.status==='passed').length;
  const failed = Math.round(A.failed*dm) + extra.filter(i=>i.status==='failed').length;
  const att = Math.round(A.attention*dm) + extra.filter(i=>i.status==='attention').length;
  const pend = dept==='All' ? (period==='week'?assigned.length:A.pending) : Math.max(1,Math.round(A.pending*dm));
  const total = passed+failed+att;
  const rate = Math.round(total/(total+pend)*100);
  const hours = Math.round(A.hours*dm);
  const pPass = passed/Math.max(1,total)*100, pAtt = att/Math.max(1,total)*100;
  const maxDept = Math.max(...A.byDept.map(d=>d.v));
  return (
    <div className="grid" style={{gap:18}}>
      <div className="row" style={{flexWrap:'wrap',gap:10}}>
        <div className="seg">{[['week','Week'],['month','Month'],['quarter','Quarter']].map(([k,l])=><button key={k} className={period===k?'on':''} onClick={()=>setPeriod(k)}>{l}</button>)}</div>
        <select className="inp" style={{width:180,height:42}} value={dept} onChange={e=>setDept(e.target.value)}>{['All','Warehouse','Maintenance','Quality','Logistics','Safety'].map(d=><option key={d} value={d}>{d==='All'?'All departments':d}</option>)}</select>
        <span className="muted" style={{marginLeft:'auto',fontSize:13}}>{A.label} · {dept==='All'?'All departments':dept}</span>
      </div>
      <div className="grid an-grid">
        <div className="card stat" onClick={()=>setView('attendance')}><div className="k"><Icon n="users" size="sm"/>Attendance rate</div><div className="v num">{A.attendance}<small>%</small></div><div className="d">Target 95%</div></div>
        <div className="card stat" onClick={()=>setView('hours')}><div className="k"><Icon n="clock" size="sm"/>Total hours worked</div><div className="v num">{hours.toLocaleString()}<small>h</small></div><div className="d">{A.hoursD} vs previous</div></div>
        <div className="card stat"><div className="k"><Icon n="check" size="sm"/>Completion rate</div><div className="v num">{rate}<small>%</small></div><div className="progress" style={{marginTop:8}}><i style={{width:rate+'%',background:'var(--blue)'}}/></div></div>
        <div className="card stat"><div className="k"><Icon n="clipboard" size="sm"/>Pending inspections</div><div className="v num">{pend}</div><div className="d">{total} completed</div></div>
      </div>
      <div className="grid an-2">
        <div className="card">
          <div className="card-h"><h3>{view==='attendance'?'Employee attendance':'Hours by department'}</h3>
            <div className="seg"><button className={view==='attendance'?'on':''} onClick={()=>setView('attendance')}>Attendance</button><button className={view==='hours'?'on':''} onClick={()=>setView('hours')}>Hours</button></div>
          </div>
          <div className="card-b">
            {view==='attendance' ? <>
              <div className="chart-bars">{A.att.map(d=>(
                <div key={d.l} className="cb-col" title={`${d.p}% present`}>
                  <span className="fs num">{d.p}%</span>
                  <div className="cb-stack" style={{height:'80%'}}>
                    <i style={{height:`${d.p}%`,background:'var(--navy-700)'}}/><i style={{height:`${d.la}%`,background:'var(--amber)'}}/><i style={{height:`${d.a}%`,background:'var(--red)'}}/>
                  </div>
                  <span className="cb-l">{d.l}</span>
                </div>))}</div>
              <div className="legend" style={{marginTop:14}}><span><i style={{background:'var(--navy-700)'}}/>Present</span><span><i style={{background:'var(--amber)'}}/>Late</span><span><i style={{background:'var(--red)'}}/>Absent</span></div>
            </> : <div style={{padding:'6px 0'}}>{A.byDept.map(d=>(
              <div key={d.l} className="hbar" style={{opacity:dept==='All'||dept===d.l?1:.35}}><span className="l">{d.l}</span><span className="t"><i style={{width:`${d.v/maxDept*100}%`,background:'var(--blue)'}}/></span><span className="v num">{d.v.toLocaleString()}h</span></div>))}</div>}
          </div>
        </div>
        <div className="card">
          <div className="card-h"><h3>Inspection outcomes</h3></div>
          <div className="card-b">
            <div className="donut-wrap">
              <div className="donut" style={{background:`conic-gradient(var(--green) 0 ${pPass}%, var(--amber) 0 ${pPass+pAtt}%, var(--red) 0 100%)`}}>
                <div><div><div className="v num">{Math.round(pPass)}%</div><div className="fs">passed</div></div></div>
              </div>
              <div style={{flex:1}}>
                <div className="summary-row"><span className="row"><span className="dot"/>Passed</span><b className="num">{passed}</b></div>
                <div className="summary-row"><span className="row"><span className="dot amber"/>Needs attention</span><b className="num">{att}</b></div>
                <div className="summary-row"><span className="row"><span className="dot red"/>Failed</span><b className="num">{failed}</b></div>
                <div className="summary-row"><span className="row"><span className="dot gray"/>Pending</span><b className="num">{pend}</b></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Integrations({ perms, sync, onSync, toggles, setToggle, deny, sheetRows }) {
  const edit = perms.integrationsEdit;
  const tg = k => edit ? setToggle(k) : deny('Change integration settings','Only Administrators can configure Google Workspace integrations. Managers have read-only access.');
  return (
    <div>
      <div className="sync-banner"><Icon n="info" size="sm"/><div><b>Prototype preview.</b> This shows how Workforce Hub would sync with your organisation's Google Workspace. No live connection has been established — sync actions are simulated.</div></div>
      <div className="grid sync-grid">
        <div className="card svc">
          <div className="svc-h"><span className="svc-logo acct"><Icon n="key"/></span><div><div className="t">Google Account sign-in</div><div className="s">SSO · tuckerops.com</div></div><button className={`toggle on ${edit?'':'ro'}`} onClick={()=>tg('sso')}/></div>
          <div className="svc-meta"><span>Domain: <b>tuckerops.com</b></span><span>Roles mapped from: <b>Google Groups</b></span><span>Status: <Status s="review" label="Configured (demo)"/></span></div>
        </div>
        <div className="card svc">
          <div className="svc-h"><span className="svc-logo sheets"><Icon n="sheet"/></span><div><div className="t">Google Sheets</div><div className="s">Timesheets & inspection log</div></div><button className={`toggle ${toggles.sheets?'on':''} ${edit?'':'ro'}`} onClick={()=>tg('sheets')}/></div>
          <div className="svc-meta"><span>Workbook: <b>WorkforceHub_Records_2026</b></span><span>Last sync: <b className="num">{sync.last}</b></span><span>Queued: <b className="num">{sync.queued} records</b></span></div>
        </div>
        <div className="card svc">
          <div className="svc-h"><span className="svc-logo drive"><Icon n="folder"/></span><div><div className="t">Google Drive</div><div className="s">Inspection photos & PDFs</div></div><button className={`toggle ${toggles.drive?'on':''} ${edit?'':'ro'}`} onClick={()=>tg('drive')}/></div>
          <div className="svc-meta"><span>Folder: <b>/Operations/Inspections/2026</b></span><span>Stored: <b className="num">1,284 files · 3.2 GB</b></span><span>Retention: <b>7 years</b></span></div>
        </div>
      </div>
      <div className="grid an-2" style={{marginTop:18}}>
        <div className="card">
          <div className="card-h"><h3>Sheets preview · Timesheets tab</h3>
            <button className="btn sm primary" onClick={onSync} disabled={sync.running||!toggles.sheets}><Icon n="refresh" size="xs" className={sync.running?'spin':''}/>{sync.running?'Syncing…':'Sync now'}</button></div>
          <div className="card-b">
            <div className="sheet">
              <div className="sheet-bar"><Icon n="sheet" size="sm" style={{color:'#1E8E4E'}}/>WorkforceHub_Records_2026 › Timesheets</div>
              <div style={{overflowX:'auto'}}><table>
                <thead><tr><th className="rn"></th><th>A · Date</th><th>B · Employee</th><th>C · In</th><th>D · Out</th><th>E · Hours</th><th>F · Site</th></tr></thead>
                <tbody>{sheetRows.map((r,i)=><tr key={i} className={r.fresh?'new':''}><td className="rn">{i+2}</td>{r.cells.map((c,j)=><td key={j} className={j>=2&&j<=4?'num':''}>{c}</td>)}</tr>)}</tbody>
              </table></div>
            </div>
          </div>
        </div>
        <div className="card">
          <div className="card-h"><h3>Sync log</h3><span className="row fs"><span className={`dot ${sync.running?'amber':''}`}/>{sync.running?'In progress':'Healthy'}</span></div>
          <div className="card-b" style={{paddingTop:6}}>
            <div className="feed">{sync.log.map((l,i)=>(
              <div key={i} className="feed-it" style={{cursor:'default'}}>
                <span className={`feed-ic ${l.ok?'in':'sys'}`}><Icon n={l.ok?'check':'refresh'} size="sm"/></span>
                <div style={{flex:1}}><div className="ft">{l.t}</div><div className="fs">{l.s}</div></div><span className="fs num">{l.time}</span>
              </div>))}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Denied({ title, msg, go }) {
  return <div className="card denied"><div className="ic"><Icon n="lock" size="lg"/></div><h3>{title}</h3><p>{msg}</p><button className="btn primary" onClick={()=>go('dash')}>Back to dashboard</button></div>;
}

function OpsScreen(props) {
  const { tab, setTab, perms, user, go } = props;
  const tabs = [
    { k:'new', l:'New Inspection', ic:'clipboard' },
    { k:'history', l:perms.allRecords?'Inspection History':'My Submissions', ic:'history' },
    { k:'analytics', l:'Analytics', ic:'chart', locked:!perms.analytics },
    { k:'integrations', l:'Google Workspace', ic:'cloud', locked:!perms.integrations },
  ];
  const visible = tabs.filter(t=>!t.locked || true);
  return (
    <div>
      <div className="page-h">
        <div className="grow"><div className="eyebrow">Inspections & Analytics</div><h2>{tabs.find(t=>t.k===tab).l}</h2></div>
        <div className="seg ops-tabs">{visible.map(t=><button key={t.k} className={tab===t.k?'on':''} onClick={()=>setTab(t.k)}><Icon n={t.locked?'lock':t.ic} size="xs" className={t.locked?'lk':''}/>{t.l}</button>)}</div>
      </div>
      {tab==='new' && <NewInspection {...props}/>}
      {tab==='history' && <History {...props}/>}
      {tab==='analytics' && (perms.analytics ? <Analytics {...props}/> : <Denied go={go} title="Analytics restricted" msg={`Your role (${user.roleLabel}) can't view team-wide attendance or performance analytics. Ask your manager if you need a report.`}/>)}
      {tab==='integrations' && (perms.integrations ? <Integrations {...props}/> : <Denied go={go} title="Integration settings restricted" msg="Google Workspace configuration is limited to Managers (read-only) and Administrators."/>)}
    </div>
  );
}

Object.assign(window,{OpsScreen});

</script>
<script type="text/babel">
// ---------- Modals ----------
function Modals(p) {
  const { modal, close } = p;
  switch (modal.kind) {
    case 'denied': return <DeniedModal {...p}/>;
    case 'submitted': return <SubmittedModal {...p}/>;
    case 'timesheets': return <TimesheetsModal {...p}/>;
    case 'attendance': return <AttendanceModal {...p}/>;
    case 'insp': return <InspModal {...p}/>;
    case 'assign': return <AssignModal {...p}/>;
    case 'users': return <UsersModal {...p}/>;
    case 'settings': return <SettingsModal {...p}/>;
    case 'access': return <AccessModal {...p}/>;
    case 'wsinfo': return <Modal title="Google Workspace" onClose={close} footer={<button className="btn primary" onClick={close}>Got it</button>}>
      <p className="muted">Your time records and inspection submissions are saved to your company's Google Workspace (Sheets & Drive) automatically. Integration settings are managed by your administrator.</p>
      <div className="sync-banner" style={{marginTop:14,marginBottom:0}}><Icon n="info" size="sm"/>Prototype — no live connection is established.</div>
    </Modal>;
    default: return null;
  }
}

function DeniedModal({ modal, close, user }) {
  return (
    <Modal title={null} onClose={close}>
      <div className="denied" style={{padding:'28px 8px 8px'}}>
        <div className="ic"><Icon n="lock" size="lg"/></div>
        <h3>Access restricted</h3>
        <p><b style={{color:'var(--ink)'}}>{modal.action}</b> isn't available for your role. {modal.why}</p>
        <div className="row" style={{justifyContent:'center',gap:10,marginBottom:8}}><span className="muted" style={{fontSize:13}}>Signed in as</span><RoleTag role={user.role}/></div>
        <div className="row" style={{justifyContent:'center',gap:10,marginTop:18}}>
          <button className="btn" onClick={close}>Close</button>
          <button className="btn primary" onClick={()=>{close(); window.__whToastReq && window.__whToastReq();}}>OK</button>
        </div>
      </div>
    </Modal>
  );
}

function SubmittedModal({ modal, close, go }) {
  const r = modal.rec;
  return (
    <Modal title={null} onClose={close}>
      <div style={{textAlign:'center',padding:'20px 4px 4px'}}>
        <div className="success-ic"><Icon n="check"/></div>
        <h3 style={{fontSize:19,fontWeight:600}}>Inspection submitted</h3>
        <p className="muted" style={{margin:'6px 0 18px'}}>{r.id} has been recorded and added to inspection history.</p>
        <div className="card" style={{textAlign:'left',padding:16,boxShadow:'none'}}>
          <dl className="kv">
            <dt>Inspection</dt><dd style={{fontWeight:600}}>{r.title}</dd>
            <dt>Location</dt><dd>{r.loc}</dd>
            <dt>Responsible</dt><dd>{r.who}</dd>
            <dt>Result</dt><dd className="row"><Status s={r.status}/><span className="num muted">{r.score}</span></dd>
            <dt>Photos</dt><dd>{r.photos} attached</dd>
            <dt>Sync</dt><dd className="row"><span className="dot amber"/>Queued for Google Sheets</dd>
          </dl>
        </div>
        <div className="row" style={{justifyContent:'center',gap:10,marginTop:18,flexWrap:'wrap'}}>
          <button className="btn" onClick={close}>New inspection</button>
          <button className="btn primary" onClick={()=>{close();go('ops','history');}}>View in history<Icon n="arrowR" size="xs"/></button>
        </div>
      </div>
    </Modal>
  );
}

function TimesheetsModal({ close, perms, user, timesheets, setTimesheets, clock, now, toast }) {
  const [tab, setTab] = React.useState(perms.approve?'team':'mine');
  const todayH = clockWorkedSec(clock, now)/3600;
  const days = WH_WEEK.map(d=>d.today?{...d,h:todayH,in:clock.inAt!=null?fmtClock(clock.inAt/60):'—',out:clock.status==='out'&&clock.outAt?fmtClock(clock.outAt/60):'—',brk:Math.round(clockBreakSec(clock,now)/60)}:d).filter(d=>!d.future);
  const setStatus = (id, s) => { setTimesheets(ts=>ts.map(t=>t.id===id?{...t,status:s}:t)); toast(s==='approved'?'Timesheet approved':'Returned for review'); };
  const pend = timesheets.filter(t=>t.status!=='approved');
  return (
    <Modal wide title="Timesheets · Week of Nov 9 – 13" onClose={close} footer={<button className="btn" onClick={close}>Close</button>}>
      <div className="seg" style={{marginBottom:16}}>
        <button className={tab==='mine'?'on':''} onClick={()=>setTab('mine')}>My timesheet</button>
        <button className={tab==='team'?'on':''} onClick={()=>perms.approve?setTab('team'):toast('Team timesheets are restricted to Managers & Administrators','err')}>{!perms.approve && <Icon n="lock" size="xs" className="lk"/>}Team approvals {perms.approve && pend.length>0 && <span className="status pending" style={{padding:'0 6px'}}>{pend.length}</span>}</button>
      </div>
      {tab==='mine' ? <>
        <table className="tbl">
          <thead><tr><th>Day</th><th>In</th><th>Out</th><th>Break</th><th style={{textAlign:'right'}}>Hours</th></tr></thead>
          <tbody>{days.map(d=><tr key={d.d}><td><b>{d.d}</b> <span className="muted">{d.date}</span>{d.today && <span className="status review" style={{marginLeft:8}}>Today</span>}</td><td className="num">{d.in}</td><td className="num">{d.out}</td><td className="num">{d.brk}m</td><td className="num" style={{textAlign:'right',fontWeight:600}}>{d.h.toFixed(2)}</td></tr>)}</tbody>
        </table>
        <div className="row" style={{justifyContent:'space-between',marginTop:14,padding:'12px 14px',background:'var(--bg)',borderRadius:12}}>
          <span>Week total <b className="num" style={{marginLeft:6}}>{days.reduce((a,d)=>a+d.h,0).toFixed(2)}h</b></span>
          <button className="btn sm primary" onClick={()=>toast('Timesheet submitted for approval')}><Icon n="send" size="xs"/>Submit for approval</button>
        </div>
      </> : <>
        <table className="tbl">
          <thead><tr><th>Employee</th><th>Hours</th><th>Overtime</th><th>Status</th><th style={{textAlign:'right'}}>Action</th></tr></thead>
          <tbody>{timesheets.map(t=>(
            <tr key={t.id}><td><b>{t.name}</b></td><td className="num">{t.hours.toFixed(2)}</td><td className="num">{t.ot?`+${t.ot.toFixed(1)}h`:'—'}</td><td><Status s={t.status}/></td>
              <td style={{textAlign:'right'}}>{t.status==='approved'?<button className="btn sm ghost" onClick={()=>setStatus(t.id,'pending')}>Undo</button>:<div className="row" style={{justifyContent:'flex-end',gap:6}}><button className="btn sm" onClick={()=>setStatus(t.id,'review')}>Query</button><button className="btn sm primary" onClick={()=>setStatus(t.id,'approved')}><Icon n="check" size="xs"/>Approve</button></div>}</td></tr>))}</tbody>
        </table>
        <div className="row" style={{justifyContent:'flex-end',marginTop:14}}><button className="btn sm blue" disabled={!pend.length} onClick={()=>{ setTimesheets(ts=>ts.map(t=>({...t,status:'approved'}))); toast(`${pend.length} timesheets approved`); }}>Approve all pending</button></div>
      </>}
    </Modal>
  );
}

function AttendanceModal({ modal, close, staff, setStaff, toast }) {
  const [f, setF] = React.useState(modal.filter||'all');
  const [sel, setSel] = React.useState(modal.focus||null);
  const list = staff.filter(s=>f==='all'||(f==='present'&&['in','break','late'].includes(s.status))||(f==='absent'&&s.status==='absent')||(f==='out'&&s.status==='out'));
  const p = staff.find(s=>s.id===sel);
  return (
    <Modal wide title="Attendance review · Today" onClose={close} footer={<><button className="btn" onClick={()=>toast('Attendance exported to Google Sheets (simulated)')}><Icon n="sheet" size="sm"/>Export to Sheets</button><button className="btn primary" onClick={close}>Done</button></>}>
      <div className="row" style={{gap:8,marginBottom:14,flexWrap:'wrap'}}>
        {[['all','All',staff.length],['present','Present',staff.filter(s=>['in','break','late'].includes(s.status)).length],['absent','Absent',staff.filter(s=>s.status==='absent').length],['out','Clocked out',staff.filter(s=>s.status==='out').length]].map(([k,l,n])=><button key={k} className={`chip ${f===k?'on':''}`} onClick={()=>setF(k)}>{l} <span className="num" style={{opacity:.7}}>{n}</span></button>)}
      </div>
      {p && <div className="card" style={{padding:14,marginBottom:14,boxShadow:'none',background:'var(--blue-50)',borderColor:'#D3E0F6'}}>
        <div className="row" style={{gap:12}}><Avatar p={p} size="lg"/><div style={{flex:1}}><div style={{fontWeight:600}}>{p.name}</div><div className="fs">{p.role} · {p.dept} · {p.site}</div></div><Status s={p.status}/></div>
        <div className="row" style={{gap:8,marginTop:12,flexWrap:'wrap'}}>
          {p.status==='absent' && <button className="btn sm" onClick={()=>{ setStaff(st=>st.map(s=>s.id===p.id?{...s,note:'Excused · approved by manager'}:s)); toast(`${p.name.split(' ')[0]} marked excused`); }}>Mark excused</button>}
          {p.status==='late' && <button className="btn sm" onClick={()=>{ setStaff(st=>st.map(s=>s.id===p.id?{...s,status:'in'}:s)); toast('Late arrival acknowledged'); }}>Acknowledge late</button>}
          <button className="btn sm" onClick={()=>toast(`Reminder sent to ${p.name.split(' ')[0]} via Google Chat (simulated)`)}>Send reminder</button>
          <button className="btn sm ghost" onClick={()=>setSel(null)}>Close</button>
        </div>
      </div>}
      <table className="tbl">
        <thead><tr><th>Employee</th><th className="hide-sm">Dept</th><th>In</th><th>Out</th><th>Status</th></tr></thead>
        <tbody>{list.map(s=>(
          <tr key={s.id} className="click" onClick={()=>setSel(s.id)} style={sel===s.id?{background:'var(--blue-50)'}:null}>
            <td><div className="person"><Avatar p={s} size="sm"/><div><div className="nm">{s.name}</div><div className="sb">{s.note||s.role}</div></div></div></td>
            <td className="hide-sm muted">{s.dept}</td><td className="num">{s.inAt}</td><td className="num">{s.outAt||'—'}</td><td><Status s={s.status}/></td>
          </tr>))}</tbody>
      </table>
    </Modal>
  );
}

function InspModal({ modal, close, perms, toast, user }) {
  const r = modal.rec; const c = catOf(r.cat);
  const items = c.items.slice(0, r.items).map((t,i)=>({t, r: i < r.items - r.failed - (r.status==='attention'?1:0) ? 'passed' : r.status==='attention'?'attention':'failed'}));
  const [state, setState] = React.useState(r.reviewed||null);
  return (
    <Modal wide title={`${r.id} · ${r.title}`} onClose={close} footer={<>
      <button className="btn" onClick={()=>toast('PDF saved to Google Drive › Inspections (simulated)')}><Icon n="file" size="sm"/>Export PDF</button>
      {perms.approve ? (state ? <span className="status approved" style={{alignSelf:'center'}}>Reviewed by {user.first}</span> : <><button className="btn" onClick={()=>{setState('returned');toast('Returned to employee for correction');}}>Return</button><button className="btn primary" onClick={()=>{setState('ok');r.reviewed='ok';toast('Inspection review signed off');}}><Icon n="check" size="sm"/>Sign off review</button></>) : <button className="btn primary" onClick={close}>Close</button>}
    </>}>
      <div className="row" style={{gap:10,marginBottom:14,flexWrap:'wrap'}}><Status s={r.status}/><span className="muted">{c.name}</span><span className="faint">·</span><span className="muted">{r.loc}</span></div>
      <dl className="kv" style={{marginBottom:16}}>
        <dt>Assigned employee</dt><dd>{r.who}</dd>
        <dt>Submitted</dt><dd className="num">{r.date} · {r.time}</dd>
        <dt>Score</dt><dd className="num">{r.score}</dd>
      </dl>
      <div className="eyebrow" style={{marginBottom:4}}>Checklist</div>
      {items.map((x,i)=><div key={i} className={`ck-item r-${x.r}`} style={{padding:'9px 0'}}><span className="ck-n num">{i+1}</span><span className="ck-t">{x.t}</span><Status s={x.r} label={({passed:'Passed',failed:'Failed',attention:'Needs attention'})[x.r]}/></div>)}
      <div className="eyebrow" style={{margin:'16px 0 6px'}}>Notes</div>
      <p className="muted" style={{fontSize:13.5}}>{r.notes || (r.status==='failed'?'Hydraulic seep at mast cylinder; horn intermittent. Unit tagged out of service and maintenance notified.':r.status==='attention'?'Minor issue flagged for follow-up within 48h. No immediate hazard.':'All items checked and compliant. No follow-up required.')}</p>
      {(r.status!=='passed' || r.photos) && <><div className="eyebrow" style={{margin:'16px 0 8px'}}>Evidence</div><div className="photos" style={{gridTemplateColumns:'repeat(4,1fr)'}}><div className="ph"><img src={WH_IMG['assets/insp2.jpg']} alt=""/></div></div></>}
    </Modal>
  );
}

function AssignModal({ close, staff, setAssigned, toast }) {
  const [cat, setCat] = React.useState('safety');
  const [who, setWho] = React.useState(staff[0].name);
  const [loc, setLoc] = React.useState(WH_LOCATIONS[0]);
  const [due, setDue] = React.useState('Nov 16');
  const [title, setTitle] = React.useState('');
  const save = () => { const s=staff.find(x=>x.name===who); setAssigned(a=>[...a,{ id:`A-${316+a.length}`, cat, title:title||`${catOf(cat).name} check`, loc, who, uid:s.id, due, status:'scheduled' }]); toast(`Inspection assigned to ${who}`); close(); };
  return (
    <Modal title="Assign inspection" onClose={close} footer={<><button className="btn" onClick={close}>Cancel</button><button className="btn primary" onClick={save}>Assign</button></>}>
      <div className="grid" style={{gap:14}}>
        <div className="field"><label>Title</label><input className="inp" value={title} onChange={e=>setTitle(e.target.value)} placeholder={`${catOf(cat).name} check`}/></div>
        <div className="field"><label>Category</label><select className="inp" value={cat} onChange={e=>setCat(e.target.value)}>{WH_CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
        <div className="field"><label>Assign to</label><select className="inp" value={who} onChange={e=>setWho(e.target.value)}>{staff.map(s=><option key={s.id}>{s.name}</option>)}</select></div>
        <div className="row" style={{gap:14}}>
          <div className="field" style={{flex:1}}><label>Location</label><select className="inp" value={loc} onChange={e=>setLoc(e.target.value)}>{WH_LOCATIONS.map(l=><option key={l}>{l}</option>)}</select></div>
          <div className="field" style={{width:140}}><label>Due</label><select className="inp" value={due} onChange={e=>setDue(e.target.value)}>{['Today, 17:00','Nov 14','Nov 16','Nov 18','Nov 20'].map(d=><option key={d}>{d}</option>)}</select></div>
        </div>
      </div>
    </Modal>
  );
}

function UsersModal({ close, users, setUsers, toast, user }) {
  const [inv, setInv] = React.useState('');
  return (
    <Modal wide title="Manage users & roles" onClose={close} footer={<button className="btn primary" onClick={close}>Done</button>}>
      <p className="muted" style={{marginBottom:14,fontSize:13.5}}>Accounts are provisioned from Google Workspace. Changing a role updates what that person can see on next sign-in.</p>
      <table className="tbl">
        <thead><tr><th>User</th><th className="hide-sm">Email</th><th>Role</th></tr></thead>
        <tbody>{users.map(u=>(
          <tr key={u.id}><td><div className="person"><Avatar p={u} size="sm"/><span className="nm">{u.name}</span></div></td><td className="hide-sm muted">{u.email}</td>
            <td><select className="inp" style={{height:36,width:160}} value={u.role} disabled={u.id===user.id} onChange={e=>{ const r=e.target.value; setUsers(us=>us.map(x=>x.id===u.id?{...x,role:r}:x)); toast(`${u.name} is now ${({admin:'an Administrator',manager:'a Manager',employee:'an Employee'})[r]}`); }}>
              <option value="admin">Administrator</option><option value="manager">Manager</option><option value="employee">Employee</option></select></td></tr>))}</tbody>
      </table>
      <div className="ck-add" style={{marginTop:16}}>
        <input className="inp" placeholder="name@tuckerops.com" value={inv} onChange={e=>setInv(e.target.value)}/>
        <button className="btn primary" style={{height:44}} onClick={()=>{ if(!/@tuckerops\.com$/.test(inv)){toast('Use a tuckerops.com Google account','err');return;} const nm=inv.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); setUsers(us=>[...us,{id:'n'+Date.now(),name:nm,email:inv,role:'employee'}]); setInv(''); toast(`Invited ${inv}`); }}><Icon n="plus" size="sm"/>Invite</button>
      </div>
    </Modal>
  );
}

function SettingsModal({ close, perms, toast, deny }) {
  const [s, setS] = React.useState({ geo:true, remind:true, autoBreak:false, offline:true });
  const rows = [
    ['remind','Clock-out reminders','Notify me if I\'m still clocked in after shift end', false],
    ['offline','Offline mode','Queue records when the tablet loses connection', false],
    ['geo','Require location for clock-in','Organisation policy · Administrators only', true],
    ['autoBreak','Auto-deduct 30 min break','Organisation policy · Administrators only', true],
  ];
  return (
    <Modal title="Settings" onClose={close} footer={<button className="btn primary" onClick={close}>Done</button>}>
      {rows.map(([k,t,d,org])=>{ const locked = org && !perms.manageUsers; return (
        <div key={k} className="ck-item">
          <div style={{flex:1}}><div style={{fontWeight:500}} className="row">{t}{locked && <Icon n="lock" size="xs" className="faint"/>}</div><div className="fs">{d}</div></div>
          <button className={`toggle ${s[k]?'on':''} ${locked?'ro':''}`} onClick={()=>{ if(locked){ deny('Organisation settings','Company-wide policies can only be changed by Administrators.'); return; } setS(x=>({...x,[k]:!x[k]})); toast('Setting saved'); }}/>
        </div>);})}
    </Modal>
  );
}

function AccessModal({ close, user, roleKey }) {
  const caps = [
    ['Clock in / out & personal timesheet', ['admin','manager','employee']],
    ['Complete assigned inspections', ['admin','manager','employee']],
    ['View own submission history', ['admin','manager','employee']],
    ['Review team attendance', ['admin','manager']],
    ['Approve timesheets', ['admin','manager']],
    ['Create & assign inspections to others', ['admin','manager']],
    ['View all inspection records', ['admin','manager']],
    ['Operational analytics', ['admin','manager']],
    ['View Google Workspace integration', ['admin','manager']],
    ['Configure integrations & settings', ['admin']],
    ['Manage users & roles', ['admin']],
  ];
  return (
    <Modal wide title="Access & permissions" onClose={close} footer={<button className="btn primary" onClick={close}>Close</button>}>
      <table className="tbl">
        <thead><tr><th>Capability</th>{['admin','manager','employee'].map(r=><th key={r} style={{textAlign:'center',color:r===roleKey?'var(--blue)':undefined}}>{({admin:'Admin',manager:'Manager',employee:'Employee'})[r]}</th>)}</tr></thead>
        <tbody>{caps.map(([t,rs])=><tr key={t}><td>{t}</td>{['admin','manager','employee'].map(r=><td key={r} style={{textAlign:'center',background:r===roleKey?'var(--blue-50)':undefined}}>{rs.includes(r)?<Icon n="check" size="sm" className="" />:<span className="faint">—</span>}</td>)}</tr>)}</tbody>
      </table>
    </Modal>
  );
}

Object.assign(window,{Modals});

</script>
<script type="text/babel">
// ---------- App shell ----------
const SIM_START = 10*3600 + 24*60; // 10:24 local sim time
const INIT_CLOCKS = {
  u1: { status:'out', inAt:null, outAt:null, breakSec:0 },
  u2: { status:'in', inAt:6*3600+45*60, breakSec:0 },
  u3: { status:'in', inAt:7*3600+2*60, breakSec:15*60 },
};

function Login({ onLogin }) {
  const roles = [
    { k:'admin', perm:'Full access · users, roles, integrations' },
    { k:'manager', perm:'Attendance, approvals, inspections, analytics' },
    { k:'employee', perm:'Own time, assigned inspections, own history' },
  ];
  return (
    <div id="login">
      <div className="lg-brand">
        <div className="logo"><span className="logo-mark">W</span>Workforce Hub<span style={{color:'#7F92AF',fontWeight:400}}>· Tucker Operations</span></div>
        <div><h1>Time, inspections and operations — in one place.</h1><p>Sign in with your company Google account. What you see is based on the role assigned by your administrator.</p></div>
        <div className="lg-foot"><span>v2.4 · Internal use only</span><span>Support: ops-it@tuckerops.com</span></div>
      </div>
      <div className="lg-panel">
        <div className="lg-card">
          <div className="logo" style={{marginBottom:28,color:'var(--navy-900)'}}><span className="logo-mark">W</span>Workforce Hub</div>
          <h2>Sign in</h2>
          <div className="sub">Use your tuckerops.com Google Workspace account.</div>
          <button className="g-btn" onClick={()=>onLogin('employee')}><span className="g-dot"/>Continue with Google</button>
          <div className="lg-div">Demo · choose an account</div>
          {roles.map(r=>{ const u=WH_USERS[r.k]; return (
            <button key={r.k} className="acct" onClick={()=>onLogin(r.k)}>
              <img className="av lg" src={u.photo} alt=""/>
              <div className="meta"><div className="row" style={{gap:8}}><span className="nm">{u.name}</span><RoleTag role={r.k}/></div><div className="em">{u.email}</div><div className="perm">{r.perm}</div></div>
              <Icon n="chevR" className="faint"/>
            </button>);})}
          <div className="lg-note"><Icon n="info" size="sm"/>Prototype — Google authentication is simulated. No account data leaves this page.</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [roleKey, setRoleKey] = React.useState(()=>localStorage.getItem('wh_role'));
  const [screen, setScreen] = React.useState(()=>localStorage.getItem('wh_screen')||'dash');
  const [opsTab, setOpsTab] = React.useState(()=>localStorage.getItem('wh_tab')||'new');
  const [now, setNow] = React.useState(SIM_START);
  const [clocks, setClocks] = React.useState(INIT_CLOCKS);
  const [staff, setStaff] = React.useState(WH_STAFF);
  const [inspections, setInspections] = React.useState(WH_INSPECTIONS);
  const [assigned, setAssigned] = React.useState(WH_ASSIGNED);
  const [activity, setActivity] = React.useState(WH_ACTIVITY);
  const [timesheets, setTimesheets] = React.useState(WH_TIMESHEETS);
  const [notifs, setNotifs] = React.useState(WH_NOTIFS);
  const [modal, setModal] = React.useState(null);
  const [pop, setPop] = React.useState(null);
  const [toasts, setToasts] = React.useState([]);
  const [prefill, setPrefill] = React.useState(null);
  const [toggles, setToggles] = React.useState({sso:true,sheets:true,drive:true});
  const [sync, setSync] = React.useState({ last:'Today 10:00', queued:3, running:false, log:[
    { ok:true, t:'Timesheets synced to Sheets', s:'14 rows updated', time:'10:00' },
    { ok:true, t:'4 inspection photos uploaded to Drive', s:'/Operations/Inspections/2026/11', time:'09:14' },
    { ok:true, t:'Inspection log synced', s:'INS-2481 appended', time:'09:13' },
  ]});
  const [sheetRows, setSheetRows] = React.useState(WH_SHEET_ROWS.map(c=>({cells:c})));
  const [users, setUsers] = React.useState([WH_USERS.admin, WH_USERS.manager, WH_USERS.employee, {id:'s2',name:'Sofia Marchetti',email:'s.marchetti@tuckerops.com',role:'employee',photo:WH_IMG['assets/p4.jpg']},{id:'s5',name:'Luis Ortega',email:'l.ortega@tuckerops.com',role:'manager'},{id:'s4',name:'Priya Raman',email:'p.raman@tuckerops.com',role:'employee'}]);

  React.useEffect(()=>{ const t=setInterval(()=>setNow(n=>n+1),1000); return ()=>clearInterval(t); },[]);
  React.useEffect(()=>{ roleKey?localStorage.setItem('wh_role',roleKey):localStorage.removeItem('wh_role'); },[roleKey]);
  React.useEffect(()=>{ localStorage.setItem('wh_screen',screen); localStorage.setItem('wh_tab',opsTab); },[screen,opsTab]);

  const toast = (msg, kind) => { const id=Math.random(); setToasts(t=>[...t,{id,msg,kind}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3000); };

  if (!roleKey) return <><Login onLogin={k=>{ setRoleKey(k); setScreen('dash'); toast(`Signed in as ${WH_USERS[k].name} · ${WH_USERS[k].roleLabel}`); }}/><Toasts list={toasts}/></>;

  const user = WH_USERS[roleKey];
  const perms = WH_PERMS[roleKey];
  const clock = clocks[user.id];
  const tm = fmtClock(now/60);

  const deny = (action, why) => setModal({ kind:'denied', action, why });
  const go = (s, tab) => {
    if (s==='ops' && tab==='analytics' && !perms.analytics) return deny('Reports & Analytics','Analytics contain team-wide attendance and performance data, available to Managers and Administrators.');
    if (s==='ops' && tab==='integrations' && !perms.integrations) return deny('Google Workspace settings','Integration settings are available to Managers (read-only) and Administrators.');
    setScreen(s); if (tab) setOpsTab(tab); setPop(null);
    const c=document.querySelector('.content'); if(c) c.scrollTop=0;
  };
  const setTab = k => go('ops', k);

  const onClock = action => {
    setClocks(cs=>{ const c={...cs[user.id]};
      if (action==='in') { if (c.outAt) { c.breakSec=(c.breakSec||0)+(now-c.outAt); } else { c.inAt=now; c.breakSec=0; } c.status='in'; c.outAt=null; }
      if (action==='out') { if (c.status==='break') c.breakSec+=now-c.breakStart; c.status='out'; c.outAt=now; }
      if (action==='break') { c.status='break'; c.breakStart=now; }
      if (action==='resume') { c.breakSec+=now-c.breakStart; c.status='in'; }
      return {...cs,[user.id]:c}; });
    const msg = { in:'Clocked in', out:'Clocked out', break:'Break started', resume:'Break ended' }[action];
    setStaff(st=>st.map(s=>s.id===user.id?{...s,status:action==='out'?'out':action==='break'?'break':'in',inAt:s.inAt==='—'?tm:s.inAt}:s));
    if (action==='in'||action==='out') setActivity(a=>[{ type:action, t:`You ${action==='in'?'clocked in':'clocked out'}`, s:`${user.site==='All sites'?'Head Office':user.site} · ${tm}`, time:tm, uid:user.id, self:true }, ...a]);
    setSync(s=>({...s,queued:s.queued+1}));
    toast(`${msg} at ${tm}`);
  };

  const onSubmit = data => {
    const n = Math.max(...inspections.map(i=>+i.id.split('-')[1]))+1;
    const rec = { id:`INS-${n}`, cat:data.cat, title:data.title, loc:data.loc, who:data.who, uid: data.who===user.name?user.id:(staff.find(s=>s.name===data.who)?.id||'x'), date:'Nov 13, 2026', time:tm, status:data.status, score:data.score, items:data.items, failed:data.failed, notes:data.notes, photos:data.photos, fresh:true };
    setInspections(xs=>[rec, ...xs.map(x=>({...x,fresh:false}))]);
    if (data.assignedId) setAssigned(a=>a.filter(x=>x.id!==data.assignedId));
    setActivity(a=>[{ type:data.status==='failed'?'fail':'insp', t:`${rec.id} ${rec.title} submitted`, s:`${rec.who} · ${STATUS_LABEL[rec.status]} ${rec.score}`, time:tm, uid:user.id }, ...a]);
    setSync(s=>({...s,queued:s.queued+1+(data.photos?1:0)}));
    setPrefill(null);
    setModal({ kind:'submitted', rec });
  };

  const startAssigned = a => { setPrefill({...a}); go('ops','new'); toast(`Loaded ${a.title}`); };
  window.__whStartAssigned = startAssigned;
  window.__whAssign = () => perms.assign ? setModal({kind:'assign'}) : deny('Assign inspection','Only Managers and Administrators can assign inspections.');

  const runSync = () => {
    setSync(s=>({...s,running:true}));
    setTimeout(()=>{
      setSync(s=>({...s,running:false,queued:0,last:`Today ${fmtClock(now/60)}`,log:[{ok:true,t:`${s.queued||1} records synced to Sheets`,s:'Timesheets & Inspection log tabs',time:fmtClock(now/60)},...s.log]}));
      const c=clocks.u3; 
      setSheetRows(r=>[{cells:['2026-11-13',user.name,clock.inAt!=null?fmtClock(clock.inAt/60):'—',clock.status==='out'&&clock.outAt?fmtClock(clock.outAt/60):'—',clock.status==='out'&&clock.outAt?(clockWorkedSec(clock,now)/3600).toFixed(2):'In progress',user.site==='All sites'?'Head Office':user.site],fresh:true},...r.map(x=>({...x,fresh:false}))].slice(0,7));
      toast('Sync complete (simulated)');
    }, 1600);
  };

  const openTs = () => setModal({kind:'timesheets'});
  const openAttendance = (filter, focus) => perms.attendance ? setModal({kind:'attendance', filter, focus}) : deny('Team attendance','Attendance records of other employees are private. Only Managers and Administrators can review them.');
  const unread = notifs.filter(n=>n.unread && (!n.priv||perms.allRecords)).length;

  const navItems = [
    { k:'dash', l:'Dashboard', ic:'home', on:()=>go('dash') },
    { k:'ops', l:'Inspections', ic:'clipboard', on:()=>go('ops', opsTab==='analytics'||opsTab==='integrations'?'new':opsTab), act: screen==='ops'&&(opsTab==='new'||opsTab==='history') },
    { k:'an', l:'Analytics', ic:'chart', on:()=>go('ops','analytics'), act: screen==='ops'&&opsTab==='analytics', locked:!perms.analytics },
    { k:'ws', l:'Workspace', ic:'cloud', on:()=>go('ops','integrations'), act: screen==='ops'&&opsTab==='integrations', locked:!perms.integrations },
  ];
  const hour = Math.floor(now/3600);

  return (
    <div id="app">
      <nav className="rail">
        <span className="logo-mark">W</span>
        {navItems.filter(n=>!n.locked).map(n=>(
          <button key={n.k} className={`nav-btn ${(n.act ?? screen===n.k)?'on':''}`} onClick={n.on}><Icon n={n.ic}/>{n.l}</button>))}
        {perms.manageUsers && <button className="nav-btn" onClick={()=>setModal({kind:'users'})}><Icon n="users"/>Users</button>}
        <span className="spacer"/>
        <button className="nav-btn" onClick={()=>setModal({kind:'settings'})}><Icon n="settings"/>Settings</button>
      </nav>
      <div className="main">
        <header className="topbar">
          <div className="hello">
            <h1>Good {hour<12?'morning':hour<17?'afternoon':'evening'}, {user.first}</h1>
            <div className="date">Friday, November 13, 2026 · <span className="num">{tm}</span></div>
          </div>
          <button className="ws-pill" onClick={()=>perms.integrations?go('ops','integrations'):setModal({kind:'wsinfo'})}>
            <span className={`dot ${sync.running?'amber':''}`}/><span className="lbl">Google Workspace · {sync.running?'syncing…':`synced ${sync.last.replace('Today ','')}`}</span>
          </button>
          <button className="icon-btn" onClick={e=>{ const r=e.currentTarget.getBoundingClientRect(); setPop(pop?.kind==='notif'?null:{kind:'notif',top:r.bottom+8,right:window.innerWidth-r.right}); }} aria-label="Notifications">
            <Icon n="bell"/>{unread>0 && <span className="badge-n">{unread}</span>}
          </button>
          <button className="me" onClick={e=>{ const r=e.currentTarget.getBoundingClientRect(); setPop(pop?.kind==='me'?null:{kind:'me',top:r.bottom+8,right:window.innerWidth-r.right}); }}>
            <Avatar p={user}/>
            <div className="meta" style={{textAlign:'left'}}><div className="nm">{user.name}</div><RoleTag role={user.role}/></div>
            <Icon n="chevD" size="sm" className="faint"/>
          </button>
        </header>
        <main className="content" data-screen-label={screen==='dash'?'01 Dashboard':'02 Inspections & Analytics'}>
          <div className="content-inner">
            {screen==='dash'
              ? <DashboardScreen user={user} perms={perms} clock={clock} nowSec={now} onClock={onClock} go={go} deny={deny} openTs={openTs} openAttendance={openAttendance} staff={staff} inspections={inspections} assigned={assigned} activity={activity} startAssigned={startAssigned}/>
              : <OpsScreen tab={opsTab} setTab={setTab} user={user} perms={perms} go={go} deny={deny} toast={toast} staff={staff} assigned={assigned} inspections={inspections} prefill={prefill} onSubmit={onSubmit} onView={rec=>setModal({kind:'insp',rec})} sync={sync} onSync={runSync} toggles={toggles} setToggle={k=>{setToggles(t=>({...t,[k]:!t[k]})); toast('Integration setting updated (demo)');}} sheetRows={sheetRows}/>}
          </div>
        </main>
      </div>

      {pop && <div style={{position:'fixed',inset:0,zIndex:54}} onClick={()=>setPop(null)}/>}
      {pop?.kind==='notif' && <div className="pop" style={{top:pop.top,right:pop.right}}>
        <div className="pop-h"><span>Notifications</span><button className="link" onClick={()=>setNotifs(n=>n.map(x=>({...x,unread:false})))}>Mark all read</button></div>
        {notifs.filter(n=>!n.priv||perms.allRecords).map((n,i)=>(
          <div key={i} className={`notif ${n.unread?'unread':''}`} onClick={()=>{ setNotifs(ns=>ns.map(x=>x===n?{...x,unread:false}:x)); setPop(null);
            if(n.go==='timesheets') openTs(); else if(n.go==='assigned') go(perms.attendance?'ops':'dash', perms.attendance?'new':undefined); else if(n.go==='integrations') perms.integrations?go('ops','integrations'):setModal({kind:'wsinfo'}); else go('ops',n.go); }}>
            <span className={`dot ${n.unread?'blue':'gray'}`} style={{marginTop:6}}/>
            <div style={{flex:1}}><div className="ft">{n.t}</div><div className="fs">{n.s}</div></div><span className="fs">{n.time}</span>
          </div>))}
      </div>}
      {pop?.kind==='me' && <div className="pop" style={{top:pop.top,right:pop.right,width:300}}>
        <div style={{padding:16,display:'flex',gap:12,alignItems:'center',borderBottom:'1px solid var(--line-2)'}}><Avatar p={user} size="lg"/><div><div style={{fontWeight:600}}>{user.name}</div><div className="fs">{user.title}</div><div className="fs">{user.email}</div></div></div>
        <div style={{padding:'8px 16px 4px'}} className="eyebrow">Switch demo role</div>
        {['admin','manager','employee'].map(k=><button key={k} className="menu-it" onClick={()=>{ setRoleKey(k); setPop(null); setPrefill(null); if(screen==='ops'&&((opsTab==='analytics'&&!WH_PERMS[k].analytics)||(opsTab==='integrations'&&!WH_PERMS[k].integrations))) setOpsTab('new'); toast(`Now viewing as ${WH_USERS[k].roleLabel}`); }}>
          <Avatar p={WH_USERS[k]} size="sm"/><span style={{flex:1}}>{WH_USERS[k].name}</span>{k===roleKey?<Icon n="check" size="sm" className="" />:<RoleTag role={k}/>}</button>)}
        <div className="sep" style={{margin:'6px 0'}}/>
        <button className="menu-it" onClick={()=>{setPop(null);setModal({kind:'access'});}}><Icon n="shield" size="sm"/>My access & permissions</button>
        <button className="menu-it" onClick={()=>{ setRoleKey(null); setPop(null); }}><Icon n="logout" size="sm"/>Sign out</button>
      </div>}

      {modal && <Modals modal={modal} close={()=>setModal(null)} setModal={setModal} user={user} perms={perms} staff={staff} setStaff={setStaff} timesheets={timesheets} setTimesheets={setTimesheets} clock={clock} now={now} toast={toast} go={go} deny={deny} users={users} setUsers={setUsers} assigned={assigned} setAssigned={setAssigned} roleKey={roleKey}/>}
      <Toasts list={toasts}/>
    </div>
  );
}

function Toasts({ list }) {
  return <div className="toasts">{list.map(t=><div key={t.id} className={`toast ${t.kind||''}`}><Icon n={t.kind==='err'?'alert':'check'} size="sm"/>{t.msg}</div>)}</div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
