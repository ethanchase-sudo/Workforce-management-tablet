<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workforce Hub · Tucker Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#081830;--navy-900:#0C2140;--navy-800:#132D53;--navy-700:#1D3E6E;--navy-600:#2A5490;
  --blue:#2F6FDB;--blue-600:#2A62C4;--blue-100:#E7EEFB;--blue-50:#F2F6FD;
  --bg:#F2F4F7;--card:#FFFFFF;--line:#E2E6EC;--line-2:#EDF0F4;
  --ink:#0F1B2D;--ink-2:#2B3647;--muted:#5E6A7B;--faint:#8D97A6;
  --green:oklch(0.6 0.13 155);--green-bg:oklch(0.96 0.03 155);
  --red:oklch(0.58 0.18 25);--red-bg:oklch(0.96 0.025 25);
  --amber:oklch(0.68 0.14 70);--amber-bg:oklch(0.97 0.035 80);
  --violet:oklch(0.58 0.13 280);
  --r-lg:18px;--r-md:12px;--r-sm:8px;
  --shadow:0 1px 2px rgba(12,33,64,.05),0 2px 8px rgba(12,33,64,.04);
  --shadow-lg:0 20px 50px -12px rgba(8,24,48,.35);
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-feature-settings:"tnum";letter-spacing:-.01em}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}svg.i.xs{width:14px;height:14px}svg.i.lg{width:24px;height:24px}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:grid;grid-template-columns:1.05fr 1fr;background:var(--navy-950);z-index:50}
.lg-brand{padding:56px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:
  radial-gradient(1200px 500px at -10% 110%,rgba(47,111,219,.35),transparent 60%),var(--navy-900)}
.lg-brand h1{font-size:44px;line-height:1.1;font-weight:600;letter-spacing:-.02em;max-width:460px;text-wrap:balance}
.lg-brand p{color:#A9B8CF;font-size:16px;max-width:420px;margin-top:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.lg-foot{color:#7F92AF;font-size:12px;display:flex;gap:18px}
.lg-panel{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:32px;overflow:auto}
.lg-card{width:100%;max-width:440px}
.lg-card h2{font-size:24px;font-weight:600;letter-spacing:-.01em}
.lg-card .sub{color:var(--muted);margin:6px 0 22px}
.g-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;height:50px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:500;box-shadow:var(--shadow)}
.g-btn:hover{border-color:#C9D1DC}
.g-dot{width:20px;height:20px;border-radius:50%;background:conic-gradient(#4285F4 0 25%,#34A853 0 50%,#FBBC05 0 75%,#EA4335 0);position:relative}
.g-dot:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.lg-div{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:22px 0 14px;text-transform:uppercase;letter-spacing:.08em}
.lg-div:before,.lg-div:after{content:"";flex:1;height:1px;background:var(--line)}
.acct{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:10px;text-align:left;transition:.15s}
.acct:hover{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.acct .meta{flex:1;min-width:0}
.acct .nm{font-weight:600}.acct .em{color:var(--muted);font-size:12.5px}
.acct .perm{font-size:12px;color:var(--muted);margin-top:4px}
.lg-note{font-size:12px;color:var(--muted);margin-top:16px;display:flex;gap:8px;align-items:flex-start}

/* ---------- SHELL ---------- */
#app{display:grid;grid-template-columns:92px 1fr;height:100vh}
.rail{background:var(--navy-900);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px;color:#9FB0C9}
.rail .logo-mark{margin-bottom:18px}
.nav-btn{width:72px;padding:10px 0 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:500;color:#9FB0C9;transition:.15s}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn.on{background:var(--navy-700);color:#fff}
.nav-btn.locked{opacity:.45}
.rail .spacer{flex:1}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{display:flex;align-items:center;gap:16px;padding:16px 28px;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .hello{flex:1;min-width:0}
.hello h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.hello .date{color:var(--muted);font-size:13px}
.ws-pill{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.ws-pill:hover{border-color:#C9D1DC}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}.dot.gray{background:#B5BECB}.dot.blue{background:var(--blue)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);position:relative;background:#fff}
.icon-btn:hover{background:var(--bg)}
.badge-n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.me{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:14px;border:1px solid var(--line)}
.me:hover{background:var(--bg)}
.me .nm{font-weight:600;font-size:13.5px;line-height:1.2}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;background:var(--blue-100);color:var(--navy-700);display:grid;place-items:center;font-weight:600;font-size:12.5px}
.av.lg{width:48px;height:48px;font-size:15px}.av.sm{width:30px;height:30px;font-size:11px}
.role{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.role.admin{background:#EDE9FB;color:#4B3AA8}.role.manager{background:var(--blue-100);color:var(--blue-600)}.role.employee{background:#E7F3EE;color:#1F7A55}
.content{flex:1;overflow:auto;padding:24px 28px 40px}
.content-inner{max-width:1280px;margin:0 auto}

/* ---------- PRIMITIVES ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:18px 20px 0}
.card-h h3{font-size:15px;font-weight:600;flex:1;letter-spacing:-.005em}
.card-b{padding:16px 20px 20px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:500;border:1px solid var(--line);background:#fff;white-space:nowrap;transition:.12s}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.btn.primary:hover{background:var(--navy-700)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}.btn.blue:hover{background:var(--blue-600)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--bg)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.lg{height:52px;padding:0 22px;font-size:15px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{color:var(--blue);font-weight:500;font-size:13px}
.link:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;color:var(--ink-2)}
.chip:hover{border-color:#C9D1DC}
.chip.on{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.status.passed,.status.in,.status.approved{background:var(--green-bg);color:oklch(0.45 0.12 155)}
.status.failed,.status.absent{background:var(--red-bg);color:oklch(0.5 0.17 25)}
.status.attention,.status.late,.status.break{background:var(--amber-bg);color:oklch(0.5 0.12 65)}
.status.scheduled,.status.out,.status.pending{background:#EEF1F5;color:var(--muted)}
.status.review{background:var(--blue-100);color:var(--blue-600)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{height:34px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(12,33,64,.12)}
.seg button .lk{opacity:.6}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.inp{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;width:100%;outline:none}
.inp:focus,textarea.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
textarea.inp{height:auto;min-height:92px;padding:10px 12px;resize:vertical}
.inp:disabled{background:var(--bg);color:var(--muted)}
.grid{display:grid;gap:18px}
.row{display:flex;align-items:center;gap:10px}
.sep{height:1px;background:var(--line-2);margin:14px 0}
.page-h{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-bottom:20px}
.page-h h2{font-size:22px;font-weight:600;letter-spacing:-.015em}
.page-h .grow{width:100%}

/* ---------- DASHBOARD ---------- */
.dash-top{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.clock-card{background:var(--navy-900);color:#fff;border:0;overflow:hidden;position:relative}
.clock-card .card-b{padding:22px 24px 24px}
.clock-status{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.08);color:#D5DEEC}
.clock-big{font-size:56px;font-weight:500;letter-spacing:-.03em;line-height:1;margin:18px 0 6px}
.clock-sub{color:#93A5C1;font-size:13px}
.clock-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.08);border-radius:14px;overflow:hidden;margin-top:22px}
.clock-stats>div{background:var(--navy-800);padding:12px 14px}
.clock-stats .k{font-size:11.5px;color:#93A5C1}
.clock-stats .v{font-size:18px;font-weight:500;margin-top:2px}
.clock-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn.clock-in{background:oklch(0.62 0.14 155);border:0;color:#fff;flex:1;min-width:180px}
.btn.clock-in:hover{background:oklch(0.57 0.14 155)}
.btn.clock-out{background:#fff;color:var(--navy-900);border:0;flex:1;min-width:180px}
.btn.clock-out:hover{background:#E9EEF6}
.btn.brk{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff}
.btn.brk:hover{background:rgba(255,255,255,.14)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:6px}
.wk-col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:pointer}
.wk-bar{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--blue-100);position:relative;transition:height .4s}
.wk-bar.done{background:var(--navy-700)}.wk-bar.today{background:var(--blue)}.wk-bar.sel{outline:2px solid var(--blue);outline-offset:2px}
.wk-h{font-size:11px;color:var(--muted)}
.wk-d{font-size:12px;font-weight:600;color:var(--ink-2)}
.wk-col.is-today .wk-d{color:var(--blue)}
.wk-sum{display:flex;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.wk-sum .k{font-size:12px;color:var(--muted)}.wk-sum .v{font-size:17px;font-weight:600}
.qa{grid-template-columns:repeat(4,1fr)}
.qa-btn{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line);text-align:left;box-shadow:var(--shadow);transition:.15s;position:relative}
.qa-btn:hover{border-color:var(--blue);transform:translateY(-1px)}
.qa-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--blue-50);color:var(--blue)}
.qa-btn .t{font-weight:600}.qa-btn .s{font-size:12.5px;color:var(--muted);margin-top:-8px}
.qa-btn.locked{background:#FAFBFC}
.qa-btn.locked .qa-ic{background:#EEF1F5;color:var(--faint)}
.qa-btn .lock{position:absolute;top:14px;right:14px;color:var(--faint)}
.ov{grid-template-columns:repeat(4,1fr)}
.stat{padding:16px 18px;cursor:pointer;transition:.15s}
.stat:hover{border-color:#C9D1DC}
.stat .k{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:500}
.stat .v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.stat .d{font-size:12px;color:var(--muted);margin-top:4px}
.stat .v small{font-size:15px;color:var(--faint);font-weight:500}
.dash-bot{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--blue-50)}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person .nm{font-weight:600;font-size:13.5px;white-space:nowrap}
.person .sb{font-size:12px;color:var(--muted);white-space:nowrap}
.feed{display:flex;flex-direction:column}
.feed-it{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.feed-it:last-child{border-bottom:0}
.feed-it:hover .ft{color:var(--blue)}
.feed-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.feed-ic.in{background:var(--green-bg);color:oklch(0.48 0.12 155)}
.feed-ic.out{background:#EEF1F5;color:var(--muted)}
.feed-ic.insp{background:var(--blue-50);color:var(--blue)}
.feed-ic.sys{background:var(--amber-bg);color:oklch(0.52 0.12 65)}
.feed-ic.fail{background:var(--red-bg);color:var(--red)}
.ft{font-size:13.5px;font-weight:500;line-height:1.35}
.fs{font-size:12px;color:var(--muted);margin-top:2px}
.tabs-mini{display:flex;gap:4px}
.tabs-mini button{font-size:12.5px;font-weight:500;padding:5px 10px;border-radius:8px;color:var(--muted)}
.tabs-mini button.on{background:var(--bg);color:var(--ink)}

/* ---------- OPS ---------- */
.ops-tabs{flex-wrap:nowrap;max-width:100%;overflow-x:auto;position:relative;z-index:1}
.new-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.cat{padding:14px 12px;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;transition:.15s}
.cat:hover{border-color:#C9D1DC}
.cat.on{border-color:var(--blue);background:var(--blue-50);box-shadow:0 0 0 3px var(--blue-100)}
.cat .ci{color:var(--blue)}
.cat .cn{font-weight:600;font-size:13.5px}.cat .cc{font-size:11.5px;color:var(--muted)}
.form-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ck-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.ck-item:last-child{border-bottom:0}
.ck-n{width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);flex:none}
.ck-item.r-passed .ck-n{background:var(--green-bg);color:oklch(0.45 0.12 155)}
.ck-item.r-failed .ck-n{background:var(--red-bg);color:var(--red)}
.ck-item.r-attention .ck-n{background:var(--amber-bg);color:oklch(0.5 0.12 65)}
.ck-t{flex:1;min-width:0;font-weight:500}
.ck-opts{display:flex;gap:6px}
.ck-o{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;background:#fff}
.ck-o:hover{border-color:#C9D1DC}
.ck-o.on.passed{background:var(--green);border-color:var(--green);color:#fff}
.ck-o.on.failed{background:var(--red);border-color:var(--red);color:#fff}
.ck-o.on.attention{background:var(--amber);border-color:var(--amber);color:#fff}
.ck-x{color:var(--faint);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.ck-x:hover{background:var(--red-bg);color:var(--red)}
.ck-add{display:flex;gap:8px;margin-top:12px}
.progress{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;display:flex}
.progress>i{display:block;height:100%;transition:width .3s}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(8,24,48,.7);color:#fff;display:grid;place-items:center}
.ph-add{aspect-ratio:1;border-radius:12px;border:1.5px dashed #C3CBD7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12px;font-weight:500;background:#FAFBFC;cursor:pointer}
.ph-add:hover{border-color:var(--blue);color:var(--blue)}
.summary-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px}
.hist-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;min-width:240px;flex:1;max-width:340px}
.search input{border:0;outline:0;flex:1;background:none}
.an-grid{grid-template-columns:repeat(4,1fr)}
.an-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.chart-bars{display:flex;align-items:flex-end;gap:12px;height:200px;padding-top:10px}
.cb-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.cb-stack{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;transition:height .4s}
.cb-stack i{display:block;width:100%}
.cb-l{font-size:12px;color:var(--muted);font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.donut-wrap{display:flex;align-items:center;gap:22px}
.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut>div{width:108px;height:108px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.donut .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1}
.hbar{display:flex;align-items:center;gap:12px;margin:10px 0}
.hbar .l{width:120px;font-size:13px;color:var(--ink-2)}
.hbar .t{flex:1;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:5px;transition:width .4s}
.hbar .v{width:56px;text-align:right;font-size:13px;font-weight:600}
.denied{text-align:center;padding:56px 24px}
.denied .ic{width:64px;height:64px;border-radius:20px;background:var(--red-bg);color:var(--red);display:grid;place-items:center;margin:0 auto 16px}
.denied h3{font-size:18px;font-weight:600}
.denied p{color:var(--muted);max-width:420px;margin:8px auto 18px}
.sync-banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--blue-50);border:1px solid #D3E0F6;color:var(--ink-2);font-size:13px;margin-bottom:18px}
.sync-grid{grid-template-columns:repeat(3,1fr)}
.svc{padding:18px}
.svc-h{display:flex;align-items:center;gap:12px}
.svc-logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.svc-logo.sheets{background:#1E8E4E}.svc-logo.drive{background:#F2B300;color:#3A2E00}.svc-logo.acct{background:#3A78E8}
.svc .t{font-weight:600}.svc .s{font-size:12.5px;color:var(--muted)}
.svc-meta{margin-top:14px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.svc-meta b{color:var(--ink-2);font-weight:500}
.toggle{width:44px;height:26px;border-radius:13px;background:#CBD3DE;position:relative;transition:.2s;flex:none;margin-left:auto}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)}.toggle.on:after{left:21px}
.toggle.ro{opacity:.55}
.sheet{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px}
.sheet-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#F7F9FB;border-bottom:1px solid var(--line);font-weight:500}
.sheet table{width:100%;border-collapse:collapse}
.sheet th,.sheet td{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:6px 10px;text-align:left;white-space:nowrap}
.sheet th{background:#FAFBFC;font-weight:600;color:var(--muted);font-size:11.5px}
.sheet td.rn,.sheet th.rn{width:34px;text-align:center;color:var(--faint);background:#FAFBFC}
.sheet tr.new td{background:oklch(0.97 0.04 155)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- OVERLAYS ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,24,48,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .18s}
.modal.wide{max-width:760px}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 22px 0}
.modal-h h3{flex:1;font-size:17px;font-weight:600}
.modal-b{padding:16px 22px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px}
.pop{position:fixed;z-index:55;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);width:360px;animation:pop .15s;overflow:hidden}
.pop-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line-2);font-weight:600}
.pop-h span{flex:1}
.notif{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.notif:hover{background:var(--bg)}
.notif.unread{background:var(--blue-50)}
.menu-it{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;font-size:13.5px;text-align:left}
.menu-it:hover{background:var(--bg)}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:10px;background:var(--navy-950);color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow-lg);animation:pop .2s}
.toast.err{background:oklch(0.42 0.14 25)}
.success-ic{width:64px;height:64px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;margin:4px auto 14px}
.success-ic svg{width:30px;height:30px;stroke-width:2.4}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}

/* ---------- RESPONSIVE ---------- */
@media (max-width:1100px){
  .dash-top,.dash-bot,.new-grid,.an-2{grid-template-columns:1fr}
  .cat-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:860px){
  #login{grid-template-columns:1fr}.lg-brand{display:none}
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{flex-direction:row;order:2;padding:6px 10px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:0}
  .rail .logo-mark,.rail .spacer{display:none}
  .nav-btn{width:auto;flex:1}
  .main{height:auto;min-height:0;overflow:hidden}
  #app{height:100vh}
  .topbar{padding:12px 16px;flex-wrap:wrap}
  .ws-pill .lbl,.me .meta{display:none}
  .content{padding:16px 16px 28px}
  .qa,.ov,.an-grid{grid-template-columns:repeat(2,1fr)}
  .sync-grid{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .cat-grid{grid-template-columns:repeat(2,1fr)}
  .ck-item{flex-wrap:wrap}.ck-opts{width:100%;padding-left:40px}.ck-o{flex:1;justify-content:center}
  .tbl .hide-sm{display:none}
  .clock-big{font-size:44px}
  .ops-tabs{display:flex;overflow-x:auto}
  .pop{width:calc(100vw - 24px);left:12px!important;right:auto!important}
}

function Icon({ n, size, className='' }) {
  return <svg className={`i ${size||''} ${className}`} viewBox="0 0 24 24"><path d={ICON_PATHS[n]||''}/></svg>;

function Avatar({ p, size='' }) {
  if (p && p.photo) return <img className={`av ${size}`} src={p.photo} alt="" />;
  const ini = p?.initials || (p?.name||'?').split(' ').map(s=>s[0]).join('').slice(0,2);
  return <div className={`av ${size}`}>{ini}</div>;
}

const STATUS_LABEL = { passed:'Passed', failed:'Failed', attention:'Needs attention', scheduled:'Scheduled', in:'Clocked in', out:'Clocked out', break:'On break', late:'Late', absent:'Absent', pending:'Pending', approved:'Approved', review:'In review' };
function Status({ s, label }) {
  return <span className={`status ${s}`}><span className={`dot ${({passed:'',in:'',approved:'',failed:'red',absent:'red',attention:'amber',late:'amber',break:'amber',review:'blue'})[s] ?? 'gray'}`}/>{label||STATUS_LABEL[s]||s}</span>;
}
function RoleTag({ role }) { return <span className={`role ${role}`}>{({admin:'Administrator',manager:'Manager',employee:'Employee'})[role]}</span>; }

function Modal({ title, onClose, children, footer, wide, icon }) {
  React.useEffect(()=>{ const k=e=>e.key==='Escape'&&onClose(); window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k); },[onClose]);
  return (
    <div className="scrim" onMouseDown={e=>e.target===e.currentTarget&&onClose()}>
      <div className={`modal ${wide?'wide':''}`} role="dialog">
        {title!==null && <div className="modal-h">{icon}<h3>{title}</h3><button className="icon-btn" style={{width:36,height:36}} onClick={onClose} aria-label="Close"><Icon n="x" size="sm"/></button></div>}
        <div className="modal-b">{children}</div>
        {footer && <div className="modal-f">{footer}</div>}
      </div>
    </div>
  );
}

function catOf(id){ return WH_CATEGORIES.find(c=>c.id===id) || WH_CATEGORIES[0]; }
function fmtHM(mins){ mins=Math.max(0,Math.floor(mins)); const h=Math.floor(mins/60), m=mins%60; return `${h}h ${String(m).padStart(2,'0')}m`; }
function fmtClock(mins){ mins=Math.max(0,Math.floor(mins)); return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`; }
function nowLabel(m){ return fmtClock(m); }

<script type="text/babel">
// ---------- Screen 1: Dashboard & Time ----------
function ClockCard({ user, clock, nowSec, onClock }) {
  const worked = clockWorkedSec(clock, nowSec);
  const brk = clockBreakSec(clock, nowSec);
  const s = clock.status;
  const h = Math.floor(worked/3600), m = Math.floor(worked%3600/60), sec = worked%60;
  const label = { in:'Clocked in', break:'On break', out: clock.outAt ? 'Clocked out' : 'Not clocked in' }[s];
  const target = 8*3600;
  return (
    <div className="card clock-card">
      <div className="card-b">
        <div className="row" style={{justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
          <span className="clock-status"><span className={`dot ${s==='in'?'':s==='break'?'amber':'gray'}`}/>{label}{s!=='out' && <span style={{color:'#93A5C1',fontWeight:500}}> · since {fmtClock(clock.inAt/60)}</span>}</span>
          <span style={{fontSize:12.5,color:'#93A5C1'}} className="row"><Icon n="pin" size="xs"/>{user.site==='All sites'?'Head Office':user.site}</span>
        </div>
        <div className="clock-big num">{String(h).padStart(2,'0')}:{String(m).padStart(2,'0')}<span style={{color:'#5D7396',fontSize:32}}>:{String(sec).padStart(2,'0')}</span></div>
        <div className="clock-sub">
          {s==='out' && !clock.outAt && 'Shift scheduled 07:00 – 15:30 · tap Clock In to start'}
          {s==='out' && clock.outAt && `Clocked out at ${fmtClock(clock.outAt/60)} · shift recorded`}
          {s!=='out' && `Worked today · ${Math.max(0, Math.round((target-worked)/60))} min remaining of 8h target`}
        </div>
        <div className="progress" style={{marginTop:14,background:'rgba(255,255,255,.1)'}}><i style={{width:`${Math.min(100,worked/target*100)}%`,background:'oklch(0.7 0.13 155)'}}/></div>
        <div className="clock-stats">
          <div><div className="k">Clock in</div><div className="v num">{clock.inAt!=null?fmtClock(clock.inAt/60):'—'}</div></div>
          <div><div className="k">Break</div><div className="v num">{fmtHM(brk/60)}</div></div>
          <div><div className="k">Today</div><div className="v num">{(worked/3600).toFixed(2)}h</div></div>
        </div>
        <div className="clock-actions">
          {s==='out' && <button className="btn lg clock-in" onClick={()=>onClock('in')}><Icon n="play" size="sm"/>{clock.outAt?'Clock In Again':'Clock In'}</button>}
          {s==='in' && <><button className="btn lg clock-out" onClick={()=>onClock('out')}><Icon n="stop" size="sm"/>Clock Out</button><button className="btn lg brk" onClick={()=>onClock('break')}><Icon n="coffee" size="sm"/>Start Break</button></>}
          {s==='break' && <><button className="btn lg clock-in" onClick={()=>onClock('resume')}><Icon n="play" size="sm"/>End Break</button><button className="btn lg brk" onClick={()=>onClock('out')}><Icon n="stop" size="sm"/>Clock Out</button></>}
        </div>
      </div>
    </div>
  );
}

function WeekCard({ clock, nowSec, onOpen }) {
  const todayH = clockWorkedSec(clock, nowSec)/3600;
  const days = WH_WEEK.map(d=>d.today?{...d,h:todayH}:d);
  const [sel, setSel] = React.useState(4);
  const total = days.reduce((a,d)=>a+d.h,0);
  const d = days[sel];
  return (
    <div className="card">
      <div className="card-h"><h3>This week</h3><button className="link" onClick={onOpen}>Full timesheet</button></div>
      <div className="card-b">
        <div className="week">
          {days.map((x,i)=>(
            <div key={i} className={`wk-col ${x.today?'is-today':''}`} onClick={()=>setSel(i)}>
              <span className="wk-h num">{x.future?'':x.h.toFixed(1)}</span>
              <div className={`wk-bar ${x.today?'today':x.future?'':'done'} ${sel===i?'sel':''}`} style={{height:`${Math.max(4,x.h/10*100)}%`}}/>
              <span className="wk-d">{x.d}</span>
            </div>
          ))}
        </div>
        <div className="wk-sum">
          <div><div className="k">Total</div><div className="v num">{total.toFixed(2)}h</div></div>
          <div><div className="k">{d.d} · {d.date}</div><div className="v num" style={{fontSize:14,marginTop:3}}>{d.future?'Not scheduled':d.today?`${fmtClock(clock.inAt!=null?clock.inAt/60:0)} – ${clock.status==='out'&&clock.outAt?fmtClock(clock.outAt/60):'now'}`:`${d.in} – ${d.out} · ${d.brk}m break`}</div></div>
          <div style={{marginLeft:'auto'}}><div className="k">Status</div><div style={{marginTop:3}}><Status s="pending" label="Not submitted"/></div></div>
        </div>
      </div>
    </div>
  );
}

function QuickActions({ perms, go, deny, openTs }) {
  const items = [
    { t:'Start Inspection', s:'New checklist', ic:'clipboard', on:()=>go('ops','new') },
    { t:'View Timesheets', s: perms.approve?'Team & personal':'Your hours', ic:'calendar', on:openTs },
    { t:'Inspection History', s: perms.allRecords?'All submissions':'Your submissions', ic:'history', on:()=>go('ops','history') },
    { t:'Reports & Analytics', s: perms.analytics?'Operational insights':'Managers & admins', ic:'chart', on:()=>perms.analytics?go('ops','analytics'):deny('Reports & Analytics','Analytics contain team-wide attendance and performance data, available to Managers and Administrators.'), locked:!perms.analytics },
  ];
  return (
    <div className="grid qa">
      {items.map(x=>(
        <button key={x.t} className={`qa-btn ${x.locked?'locked':''}`} onClick={x.on}>
          {x.locked && <span className="lock"><Icon n="lock" size="sm"/></span>}
          <span className="qa-ic"><Icon n={x.ic}/></span>
          <span className="t">{x.t}</span><span className="s">{x.s}</span>
        </button>
      ))}
    </div>
  );
}

function Overview({ user, perms, staff, inspections, assigned, clock, nowSec, go, openAttendance }) {
  if (!perms.attendance) {
    const mine = inspections.filter(i=>i.uid===user.id);
    const myAssigned = assigned.filter(a=>a.uid===user.id);
    const week = WH_WEEK.reduce((a,d)=>a+(d.today?0:d.h),0) + clockWorkedSec(clock,nowSec)/3600;
    const cards = [
      { k:'Assigned to me', v:myAssigned.length, d: myAssigned[0]?`Next: ${myAssigned[0].due}`:'Nothing due', ic:'clipboard', on:()=>go('ops','new') },
      { k:'My completed', v:mine.length, d:'Submitted this month', ic:'check', on:()=>go('ops','history') },
      { k:'Hours this week', v:<>{week.toFixed(1)}<small> / 40</small></>, d:'Mon – Fri', ic:'clock', on:null },
      { k:'Pass rate', v:<>{Math.round(mine.filter(i=>i.status==='passed').length/Math.max(1,mine.length)*100)}<small>%</small></>, d:'Your inspections', ic:'badge', on:()=>go('ops','history') },
    ];
    return <div className="grid ov">{cards.map(c=><div key={c.k} className="card stat" onClick={c.on||undefined} style={!c.on?{cursor:'default'}:null}><div className="k"><Icon n={c.ic} size="sm"/>{c.k}</div><div className="v num">{c.v}</div><div className="d">{c.d}</div></div>)}</div>;
  }
  const inN = staff.filter(s=>s.status==='in'||s.status==='break'||s.status==='late').length;
  const absent = staff.filter(s=>s.status==='absent').length;
  const pending = assigned.length;
  const done = inspections.filter(i=>i.date.startsWith('Nov 13')||i.date.startsWith('Nov 12')||i.date.startsWith('Nov 11')||i.date.startsWith('Nov 10')||i.date.startsWith('Nov 9')).length;
  const cards = [
    { k:'Clocked in now', v:<>{inN}<small> / {staff.length}</small></>, d:`${staff.filter(s=>s.status==='break').length} on break · ${staff.filter(s=>s.status==='late').length} late`, ic:'users', on:()=>openAttendance('present') },
    { k:'Absent / not in', v:absent, d:staff.filter(s=>s.status==='absent').map(s=>s.name.split(' ')[0]).join(', ')||'Everyone accounted for', ic:'userx', on:()=>openAttendance('absent') },
    { k:'Pending inspections', v:pending, d:`${assigned.filter(a=>a.due.startsWith('Today')).length} due today`, ic:'clipboard', on:()=>go('ops','new') },
    { k:'Completed this week', v:done, d:`${inspections.filter(i=>i.status==='failed').length} failed · ${inspections.filter(i=>i.status==='attention').length} flagged`, ic:'check', on:()=>go('ops','history') },
  ];
  return <div className="grid ov">{cards.map(c=><div key={c.k} className="card stat" onClick={c.on}><div className="k"><Icon n={c.ic} size="sm"/>{c.k}</div><div className="v num">{c.v}</div><div className="d">{c.d}</div></div>)}</div>;
}

function AttendancePanel({ staff, openAttendance }) {
  return (
    <div className="card">
      <div className="card-h"><h3>Team attendance · today</h3><button className="btn sm" onClick={()=>openAttendance('all')}><Icon n="eye" size="xs"/>Review all</button></div>
      <div className="card-b" style={{paddingTop:8}}>
        <table className="tbl">
          <thead><tr><th>Employee</th><th className="hide-sm">Site</th><th>In</th><th>Status</th></tr></thead>
          <tbody>{staff.slice(0,6).map(s=>(
            <tr key={s.id} className="click" onClick={()=>openAttendance('all', s.id)}>
              <td><div className="person"><Avatar p={s} size="sm"/><div><div className="nm">{s.name}</div><div className="sb">{s.role}</div></div></div></td>
              <td className="hide-sm muted">{s.site}</td>
              <td className="num">{s.inAt}</td>
              <td><Status s={s.status}/></td>
            </tr>))}</tbody>
        </table>
      </div>
    </div>
  );
}

function MyAssignedPanel({ user, assigned, go, startAssigned }) {
  const mine = assigned.filter(a=>a.uid===user.id);
  return (
    <div className="card">
      <div className="card-h"><h3>Assigned to you</h3><button className="link" onClick={()=>go('ops','history')}>My history</button></div>
      <div className="card-b" style={{paddingTop:8}}>
        {mine.length===0 && <div className="muted" style={{padding:'24px 0',textAlign:'center'}}>No open inspections. Nice work.</div>}
        {mine.map(a=>{ const c=catOf(a.cat); return (
          <div key={a.id} className="ck-item">
            <span className="qa-ic" style={{width:40,height:40}}><Icon n={c.icon} size="sm"/></span>
            <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600}}>{a.title}</div><div className="fs">{a.loc} · Due {a.due}</div></div>
            <button className="btn sm blue" onClick={()=>startAssigned(a)}>Start<Icon n="arrowR" size="xs"/></button>
          </div>);})}
      </div>
    </div>
  );
}

function ActivityFeed({ user, perms, activity, go, openAttendance }) {
  const [tab, setTab] = React.useState('all');
  let list = perms.allRecords ? activity : activity.filter(a=>!a.priv && (!a.uid || a.uid===user.id));
  if (!perms.allRecords) list = list.map(a=>a.self?a:a);
  list = list.filter(a=> tab==='all' || (tab==='time'&&(a.type==='in'||a.type==='out')) || (tab==='insp'&&(a.type==='insp'||a.type==='fail')) || (tab==='sys'&&a.type==='sys'));
  const icon = { in:'play', out:'stop', insp:'clipboard', fail:'alert', sys:'bell' };
  const click = a => { if (a.type==='insp'||a.type==='fail') go('ops','history'); else if (a.type==='sys') go('ops', perms.integrations?'integrations':'history'); else if (perms.attendance) openAttendance('all'); };
  return (
    <div className="card">
      <div className="card-h"><h3>Recent activity</h3>
        <div className="tabs-mini">{[['all','All'],['time','Time'],['insp','Inspections'],['sys','System']].map(([k,l])=><button key={k} className={tab===k?'on':''} onClick={()=>setTab(k)}>{l}</button>)}</div>
      </div>
      <div className="card-b" style={{paddingTop:6}}>
        <div className="feed">
          {list.length===0 && <div className="muted" style={{padding:'20px 0',textAlign:'center'}}>No activity in this category.</div>}
          {list.slice(0,7).map((a,i)=>(
            <div key={i} className="feed-it" onClick={()=>click(a)}>
              <span className={`feed-ic ${a.type}`}><Icon n={icon[a.type]} size="sm"/></span>
              <div style={{flex:1,minWidth:0}}><div className="ft">{a.t}</div><div className="fs">{a.s}</div></div>
              <span className="fs num">{a.time}</span>
            </div>))}
        </div>
      </div>
    </div>
  );
}

function DashboardScreen(props) {
  const { user, perms, clock, nowSec, onClock, go, deny, openTs, openAttendance, staff, inspections, assigned, activity, startAssigned } = props;
  return (
    <div className="grid" style={{gap:18}}>
      <div className="grid dash-top">
        <ClockCard user={user} clock={clock} nowSec={nowSec} onClock={onClock}/>
        <WeekCard clock={clock} nowSec={nowSec} onOpen={openTs}/>
      </div>
      <QuickActions perms={perms} go={go} deny={deny} openTs={openTs}/>
      <div>
        <div className="row" style={{marginBottom:10}}><span className="eyebrow">{perms.attendance?`Operational overview · ${user.site}`:'Your overview'}</span></div>
        <Overview {...props}/>
      </div>
      <div className="grid dash-bot">
        {perms.attendance ? <AttendancePanel staff={staff} openAttendance={openAttendance}/> : <MyAssignedPanel user={user} assigned={assigned} go={go} startAssigned={startAssigned}/>}
        <ActivityFeed user={user} perms={perms} activity={activity} go={go} openAttendance={openAttendance}/>
      </div>
    </div>
  );
}

function clockWorkedSec(c, now) {
  if (c.inAt==null) return 0;
  const end = c.status==='out' ? (c.outAt ?? c.inAt) : now;
  return Math.max(0, Math.floor(end - c.inAt - clockBreakSec(c, now)));
}
function clockBreakSec(c, now) { return Math.floor((c.breakSec||0) + (c.status==='break' ? now - c.breakStart : 0)); }

Object.assign(window,{DashboardScreen,clockWorkedSec,clockBreakSec});

</script>
<script type="text/babel">
// ---------- Screen 2: Inspections & Analytics ----------
const PHOTO_POOL = [WH_IMG['assets/insp2.jpg']];

function NewInspection({ user, perms, staff, assigned, prefill, onSubmit, deny, toast }) {
  const [cat, setCat] = React.useState(prefill?.cat || 'safety');
  const [title, setTitle] = React.useState(prefill?.title || '');
  const [date, setDate] = React.useState('2026-11-13');
  const [loc, setLoc] = React.useState(prefill?.loc || WH_LOCATIONS[0]);
  const [who, setWho] = React.useState(prefill?.who || user.name);
  const [items, setItems] = React.useState(()=>catOf(prefill?.cat||'safety').items.map((t,i)=>({id:i,t,r:null})));
  const [newItem, setNewItem] = React.useState('');
  const [notes, setNotes] = React.useState('');
  const [photos, setPhotos] = React.useState([]);
  const [tried, setTried] = React.useState(false);
  const fileRef = React.useRef();

  React.useEffect(()=>{ if(prefill){ setCat(prefill.cat); setTitle(prefill.title); setLoc(prefill.loc); setWho(prefill.who); setItems(catOf(prefill.cat).items.map((t,i)=>({id:i,t,r:null}))); } },[prefill]);

  const pickCat = id => { setCat(id); setItems(catOf(id).items.map((t,i)=>({id:i,t,r:null}))); };
  const setR = (id,r) => setItems(xs=>xs.map(x=>x.id===id?{...x,r:x.r===r?null:r}:x));
  const addItem = () => { if(!newItem.trim()) return; setItems(xs=>[...xs,{id:Date.now(),t:newItem.trim(),r:null}]); setNewItem(''); };
  const counts = { passed:items.filter(x=>x.r==='passed').length, failed:items.filter(x=>x.r==='failed').length, attention:items.filter(x=>x.r==='attention').length };
  const done = counts.passed+counts.failed+counts.attention;
  const complete = done===items.length && items.length>0;
  const outcome = counts.failed?'failed':counts.attention?'attention':'passed';

  const onFiles = e => {
    const fs=[...e.target.files].slice(0,6-photos.length);
    fs.forEach(f=>{ const r=new FileReader(); r.onload=()=>setPhotos(p=>[...p,r.result]); r.readAsDataURL(f); });
    e.target.value='';
  };
  const addSample = () => { if(photos.length>=6) return; setPhotos(p=>[...p, PHOTO_POOL[0]]); toast('Sample evidence photo attached'); };
  const chooseWho = v => { if(!perms.assign && v!==user.name){ deny('Assign to another employee','Only Managers and Administrators can assign inspections to other employees.'); return; } setWho(v); };

  const submit = () => {
    setTried(true);
    if (!complete) { toast(`Rate all checklist items (${items.length-done} remaining)`, 'err'); return; }
    if (!title.trim()) { toast('Add an inspection title', 'err'); return; }
    if ((counts.failed||counts.attention) && !notes.trim()) { toast('Add notes describing failed or flagged items', 'err'); return; }
    onSubmit({ cat, title:title.trim(), loc, who, date, items:items.length, failed:counts.failed, status:outcome, score:`${counts.passed}/${items.length}`, photos:photos.length, notes, assignedId:prefill?.id });
    setItems(catOf(cat).items.map((t,i)=>({id:i,t,r:null}))); setTitle(''); setNotes(''); setPhotos([]); setTried(false);
  };

  const people = perms.assign ? [user.name, ...staff.map(s=>s.name).filter(n=>n!==user.name)] : [user.name];
  const myAssigned = perms.allRecords ? assigned : assigned.filter(a=>a.uid===user.id);

  return (
    <div className="grid new-grid">
      <div className="grid" style={{gap:18}}>
        <div className="card">
          <div className="card-h"><h3>Inspection details</h3>{prefill && <span className="status review">From assignment {prefill.id}</span>}</div>
          <div className="card-b">
            <div className="field" style={{marginBottom:14}}><label>Category</label>
              <div className="cat-grid">{WH_CATEGORIES.map(c=>(
                <button key={c.id} className={`cat ${cat===c.id?'on':''}`} onClick={()=>pickCat(c.id)}>
                  <span className="ci"><Icon n={c.icon}/></span><span className="cn">{c.name}</span><span className="cc">{c.items.length} default items</span>
                </button>))}</div>
            </div>
            <div className="field" style={{marginBottom:14}}><label>Inspection title</label>
              <input className="inp" value={title} onChange={e=>setTitle(e.target.value)} placeholder={`e.g. ${catOf(cat).name} check — ${loc.split(' · ')[1]||loc}`} style={tried&&!title.trim()?{borderColor:'var(--red)'}:null}/>
            </div>
            <div className="form-row">
              <div className="field"><label>Date</label><input type="date" className="inp" value={date} onChange={e=>setDate(e.target.value)}/></div>
              <div className="field"><label>Location</label><select className="inp" value={loc} onChange={e=>setLoc(e.target.value)}>{WH_LOCATIONS.map(l=><option key={l}>{l}</option>)}</select></div>
              <div className="field"><label>Responsible employee {!perms.assign && <Icon n="lock" size="xs" className="faint"/>}</label>
                <select className="inp" value={who} onChange={e=>chooseWho(e.target.value)} onMouseDown={e=>{ if(!perms.assign){ e.preventDefault(); deny('Assign to another employee','Only Managers and Administrators can assign inspections to other employees.'); } }}>
                  {people.map(p=><option key={p}>{p}</option>)}
                </select></div>
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-h"><h3>Checklist</h3><span className="muted num" style={{fontSize:13}}>{done}/{items.length} rated</span>
            <button className="btn sm ghost" onClick={()=>setItems(xs=>xs.map(x=>({...x,r:'passed'})))}><Icon n="check" size="xs"/>Pass all</button>
          </div>
          <div className="card-b" style={{paddingTop:12}}>
            <div className="progress" style={{marginBottom:6}}>
              <i style={{width:`${counts.passed/Math.max(1,items.length)*100}%`,background:'var(--green)'}}/>
              <i style={{width:`${counts.attention/Math.max(1,items.length)*100}%`,background:'var(--amber)'}}/>
              <i style={{width:`${counts.failed/Math.max(1,items.length)*100}%`,background:'var(--red)'}}/>
            </div>
            {items.map((x,i)=>(
              <div key={x.id} className={`ck-item ${x.r?'r-'+x.r:''}`} style={tried&&!x.r?{background:'var(--red-bg)',margin:'0 -10px',padding:'12px 10px',borderRadius:10}:null}>
                <span className="ck-n num">{i+1}</span>
                <span className="ck-t">{x.t}</span>
                <div className="ck-opts">
                  <button className={`ck-o passed ${x.r==='passed'?'on':''}`} onClick={()=>setR(x.id,'passed')}><Icon n="check" size="xs"/>Pass</button>
                  <button className={`ck-o attention ${x.r==='attention'?'on':''}`} onClick={()=>setR(x.id,'attention')}><Icon n="alert" size="xs"/>Attention</button>
                  <button className={`ck-o failed ${x.r==='failed'?'on':''}`} onClick={()=>setR(x.id,'failed')}><Icon n="x" size="xs"/>Fail</button>
                </div>
                <button className="ck-x" title="Remove item" onClick={()=>setItems(xs=>xs.filter(y=>y.id!==x.id))}><Icon n="trash" size="xs"/></button>
              </div>))}
            <div className="ck-add">
              <input className="inp" placeholder="Add a custom checklist item…" value={newItem} onChange={e=>setNewItem(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addItem()}/>
              <button className="btn" style={{height:44}} onClick={addItem}><Icon n="plus" size="sm"/>Add</button>
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-h"><h3>Notes & evidence</h3></div>
          <div className="card-b">
            <div className="field" style={{marginBottom:16}}><label>Notes and observations {(counts.failed||counts.attention)?<span style={{color:'var(--red)'}}>· required for flagged items</span>:null}</label>
              <textarea className="inp" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Describe findings, corrective actions taken, or follow-up required…"/></div>
            <div className="field"><label>Photo attachments <span className="faint">· {photos.length}/6</span></label>
              <div className="photos" style={{gridTemplateColumns:'repeat(auto-fill,minmax(110px,1fr))'}}>
                {photos.map((p,i)=><div key={i} className="ph"><img src={p} alt=""/><button className="rm" onClick={()=>setPhotos(ps=>ps.filter((_,j)=>j!==i))}><Icon n="x" size="xs"/></button></div>)}
                {photos.length<6 && <div className="ph-add" onClick={()=>fileRef.current.click()}><Icon n="camera"/>Take / upload</div>}
                {photos.length<6 && <div className="ph-add" onClick={addSample}><Icon n="plus"/>Sample photo</div>}
              </div>
              <input ref={fileRef} type="file" accept="image/*" multiple hidden onChange={onFiles}/>
            </div>
          </div>
        </div>
      </div>

      <div className="grid" style={{gap:18,position:'sticky',top:0}}>
        <div className="card">
          <div className="card-h"><h3>Summary</h3></div>
          <div className="card-b">
            <div className="summary-row"><span className="muted">Category</span><b>{catOf(cat).name}</b></div>
            <div className="summary-row"><span className="muted">Location</span><b>{loc}</b></div>
            <div className="summary-row"><span className="muted">Responsible</span><b>{who}</b></div>
            <div className="sep"/>
            <div className="summary-row"><span className="row"><span className="dot"/>Passed</span><b className="num">{counts.passed}</b></div>
            <div className="summary-row"><span className="row"><span className="dot amber"/>Needs attention</span><b className="num">{counts.attention}</b></div>
            <div className="summary-row"><span className="row"><span className="dot red"/>Failed</span><b className="num">{counts.failed}</b></div>
            <div className="summary-row"><span className="row"><span className="dot gray"/>Unrated</span><b className="num">{items.length-done}</b></div>
            <div className="summary-row"><span className="row"><Icon n="camera" size="xs"/>Photos</span><b className="num">{photos.length}</b></div>
            <div className="sep"/>
            <div className="summary-row" style={{alignItems:'center'}}><span className="muted">Projected outcome</span>{complete?<Status s={outcome}/>:<Status s="pending" label="Incomplete"/>}</div>
            <button className="btn lg blue" style={{width:'100%',marginTop:14}} onClick={submit}><Icon n="send" size="sm"/>Submit Inspection</button>
            <div className="fs" style={{marginTop:10,textAlign:'center'}}>Saved to records · queued for Google Sheets sync</div>
          </div>
        </div>
        <div className="card">
          <div className="card-h"><h3>{perms.allRecords?'Open assignments':'Your assignments'}</h3><span className="muted num">{myAssigned.length}</span></div>
          <div className="card-b" style={{paddingTop:6}}>
            {myAssigned.length===0 && <div className="muted" style={{padding:'12px 0'}}>Nothing outstanding.</div>}
            {myAssigned.slice(0,5).map(a=>(
              <div key={a.id} className="feed-it" onClick={()=>window.__whStartAssigned(a)}>
                <span className="feed-ic insp"><Icon n={catOf(a.cat).icon} size="sm"/></span>
                <div style={{flex:1,minWidth:0}}><div className="ft">{a.title}</div><div className="fs">{perms.allRecords?a.who+' · ':''}Due {a.due}</div></div>
                <Icon n="chevR" size="sm" className="faint"/>
              </div>))}
            {perms.assign && <button className="btn sm" style={{marginTop:8,width:'100%'}} onClick={()=>window.__whAssign()}><Icon n="plus" size="xs"/>Assign inspection</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

function History({ user, perms, inspections, onView }) {
  const [q, setQ] = React.useState('');
  const [f, setF] = React.useState('all');
  let list = perms.allRecords ? inspections : inspections.filter(i=>i.uid===user.id);
  list = list.filter(i=>(f==='all'||i.status===f) && (i.title+i.who+i.id+i.loc).toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="card">
      <div className="card-b">
        <div className="hist-tools">
          <div className="search"><Icon n="search" size="sm" className="faint"/><input placeholder="Search by ID, title, employee, location…" value={q} onChange={e=>setQ(e.target.value)}/></div>
          {[['all','All'],['passed','Passed'],['attention','Needs attention'],['failed','Failed']].map(([k,l])=><button key={k} className={`chip ${f===k?'on':''}`} onClick={()=>setF(k)}>{l}</button>)}
          <span className="muted" style={{marginLeft:'auto',fontSize:13}}>{perms.allRecords?'All employees':'Showing your submissions only'}</span>
        </div>
        <table className="tbl">
          <thead><tr><th>ID</th><th>Inspection</th><th className="hide-sm">Assigned employee</th><th className="hide-sm">Submitted</th><th>Score</th><th>Status</th><th></th></tr></thead>

              <tr key={i.id} className="click" onClick={()=>onView(i)} style={i.fresh?{background:'oklch(0.97 0.04 155)'}:null}>

                <td><div style={{fontWeight:600}}>{i.title}</div><div className="fs">{catOf(i.cat).name} · {i.loc}</div></td>
